; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; esp32-c6-super-mini - for ESP-C6 SuperMini board
; nodemcuv2  - for NodeMCU board

default_envs = esp32-c6-super-mini 

extra_configs = secrets.ini  


[env]
; версия протокола библиотеки. попадет в запрос /version
metf_version = "\"12\""

; Предупреждения - только для своего кода: build_src_flags не доходит до
; библиотек, и чужие предупреждения не топят свои. См. docs/testing.md.
build_src_flags = -Wall -Wextra

; Статический анализ: pio check -e <env> - это cppcheck. clang-tidy отсюда
; не зовём: clang не разбирает заголовки тулчейна ESP (FreeRTOS.h, stddef.h
; из riscv32-esp дают ошибки разбора), и всё после них - ложные срабатывания.
; clang-tidy гоняет scripts/tidy.sh по коду, который собирается на хосте.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/> +<lib/> +<test/test_ntp_packet/> +<test/test_wifi_policy/> +<test/test_blinker/> +<test/test_wifi_reason/>
check_flags =
    ; -DPROGMEM= : макрос приходит из ядра, а cppcheck собирает без него и
    ; на строке с PROGMEM бросает разбор целого файла ([high] unknownMacro)
    cppcheck: --enable=warning,style,performance,portability --inline-suppr -DPROGMEM=

[env:nodemcuv2]
board = nodemcuv2
test_filter = test_board

;[env:d1_mini_pro]
;board = d1_mini_pro

platform = espressif8266@4.2.1
framework = arduino

upload_speed = 230400
monitor_speed = 115200

# Та же библиотека, что и у C6: ESP32Async держит один код на обе платы, и
# ESP8266 перестаёт жить на форке пятилетней давности.
# https://github.com/ESP32Async/ESPAsyncWebServer
lib_deps =
    https://github.com/ESP32Async/ESPAsyncTCP.git#v2.0.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1

lib_extra_dirs = lib
#test_build_project_src = true

# порт заливки - по USB-серийнику платы из secrets.ini, см. docs/build.md
extra_scripts = pre:scripts/pick_port.py

build_flags = -DMETF_VERSION=${this.metf_version}
              -DLOG_LEVEL_DEBUG
              -DBUTTON_PIN=0               ; кнопка FLASH: 3 с - поднять свою точку
              -DSTATUS_LED_PIN=2           ; синий светодиод модуля, горит от нуля
              -DSSID_NAME=${secrets.wifi_ssid}
              -DSSID_PASS=${secrets.wifi_password}



[env:esp32-c6-super-mini]

board = esp32-c6-devkitm-1
test_filter = test_board

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

framework = arduino

upload_speed = 460800
monitor_speed = 115200

# Библиотека переехала из mathieucarbou в организацию ESP32Async - это она же,
# тот же автор и та же история; версии там ушли далеко вперёд.
# https://github.com/ESP32Async/ESPAsyncWebServer
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1

lib_extra_dirs = lib

# порт заливки - по USB-серийнику платы из secrets.ini, см. docs/build.md
extra_scripts = pre:scripts/pick_port.py

build_flags = -D ESP32_C6_env
              -D ARDUINO_USB_MODE=1          ; аппаратный USB Serial/JTAG (у C6 нет USB-OTG)
              -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial → нативный USB CDC, включается на старте
              -D METF_VERSION=${this.metf_version}
              -D ASB_BUFFER_BYTES=65536      # лог: 64 КБ из 512 КБ SRAM у C6
              -D ASB_MAX_LINE_LEN=128        # 512 строк; префикс лога Ватериуса - 27 символов
              -D RGB_DEFAULT_PIN=8           ; встроенный WS2812 ESP32-C6 SuperMini
              -D BUTTON_PIN=9                ; кнопка BOOT: 3 с - поднять свою точку
              -D LOG_LEVEL_DEBUG
              -D SSID_NAME=${secrets.wifi_ssid}
              -D SSID_PASS=${secrets.wifi_password}
	


; Хостовые тесты: чистый C++ без Arduino и без сети - сборка пакета NTP,
; политика подключения, ритмы светодиода, разбор причины отказа радио.
; Работа платы - test/board (pytest).
; Из src/ собираются только файлы без Arduino: остальное хосту не по зубам.
[env:native]
platform = native
test_framework = unity
test_filter = test_ntp_packet, test_wifi_policy, test_blinker, test_wifi_reason, test_asb
test_build_src = yes
build_src_filter = -<*> +<wifi_policy.cpp> +<blinker.cpp> +<wifi_reason.cpp> +<AsyncSerialBuffer.cpp>
; Кольцу лога нужен Arduino.h - на хосте его подменяет заглушка из test/test_asb
build_flags = -std=c++17 -Isrc -Itest/test_asb
