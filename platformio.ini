; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; esp32-c6-super-mini - for ESP-C6 SuperMini board
; nodemcuv2  - for NodeMCU board

default_envs = esp32-c6-super-mini 

extra_configs = secrets.ini  


[env]
; версия протокола библиотеки. попадет в запрос /version
metf_version = "\"8\""

; Предупреждения - только для своего кода: build_src_flags не доходит до
; библиотек, и чужие предупреждения не топят свои. См. docs/testing.md.
build_src_flags = -Wall -Wextra

; Статический анализ: pio check -e <env> - это cppcheck. clang-tidy отсюда
; не зовём: clang не разбирает заголовки тулчейна ESP (FreeRTOS.h, stddef.h
; из riscv32-esp дают ошибки разбора), и всё после них - ложные срабатывания.
; clang-tidy гоняет scripts/tidy.sh по коду, который собирается на хосте.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/> +<lib/> +<test/test_ntp_packet/> +<test/test_wifi_policy/> +<test/test_blinker/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr

[env:nodemcuv2]
board = nodemcuv2
test_filter = test_board

;[env:d1_mini_pro]
;board = d1_mini_pro

platform = espressif8266@4.2.1
framework = arduino

upload_speed = 230400
monitor_speed = 115200

# https://github.com/me-no-dev/ESPAsyncWebServer
lib_deps =
    ESP Async WebServer@1.2.3

lib_extra_dirs = lib
#test_build_project_src = true

# порт заливки - по USB-серийнику платы из secrets.ini, см. docs/build.md
extra_scripts = pre:scripts/pick_port.py

build_flags = -DMETF_VERSION=${this.metf_version}
              -DLOG_LEVEL_DEBUG
              -DSSID_NAME=${secrets.wifi_ssid}
              -DSSID_PASS=${secrets.wifi_password}



[env:esp32-c6-super-mini]

board = esp32-c6-devkitm-1
test_filter = test_board

platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip

framework = arduino

upload_speed = 460800
monitor_speed = 115200

# Using mathieucarbou fork for ESP32-C6 compatibility
# https://github.com/mathieucarbou/ESPAsyncWebServer
lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.3.15
    fastled/FastLED@^3.7.0

lib_extra_dirs = lib

# порт заливки - по USB-серийнику платы из secrets.ini, см. docs/build.md
extra_scripts = pre:scripts/pick_port.py

build_flags = -D ESP32_C6_env
              -D ARDUINO_USB_MODE=1          ; аппаратный USB Serial/JTAG (у C6 нет USB-OTG)
              -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial → нативный USB CDC, включается на старте
              -D METF_VERSION=${this.metf_version}
              -D ASB_BUFFER_BYTES=65536      # лог: 64 КБ из 512 КБ SRAM у C6
              -D ASB_MAX_LINE_LEN=128        # 512 строк; префикс лога Ватериуса - 27 символов
              -D RGB_DEFAULT_PIN=8  # buildin RGB LED in ESP32-C6 super mini
              -D RGB_NUMBER=1
              -D LOG_LEVEL_DEBUG
              -D SSID_NAME=${secrets.wifi_ssid}
              -D SSID_PASS=${secrets.wifi_password}
	


; Хостовые тесты: чистый C++ без Arduino и без сети - сборка пакета NTP,
; политика подключения, ритмы светодиода. Работа платы - test/board (pytest).
; Из src/ собираются только файлы без Arduino: остальное хосту не по зубам.
[env:native]
platform = native
test_framework = unity
test_filter = test_ntp_packet, test_wifi_policy, test_blinker
test_build_src = yes
build_src_filter = -<*> +<wifi_policy.cpp> +<blinker.cpp>
build_flags = -std=c++17 -Isrc
